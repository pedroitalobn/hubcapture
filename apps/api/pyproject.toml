[project]
name = "hub-capture-api"
version = "0.0.0"
description = "Hub Capture — API v1 (FastAPI): API pública + IA + ingestão"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "fastapi-users[sqlalchemy]>=14.0.0",
    "pgvector>=0.3.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "litellm>=1.50.0",
    "reportlab>=4.2.0",
]

# Scraping local (browser headless no próprio container): o painel da Visão
# Geral do TransfereGov e a consulta do FNS só existem depois que o JS roda.
# Extra opcional — sem ele a API sobe igual e os providers ficam desabilitados
# (a facade `scraping.scraper` degrada), com o custo de não coletar essas duas
# páginas. A imagem de produção instala com `uv sync --extra scraping`.
[project.optional-dependencies]
scraping = [
    "playwright>=1.47.0",
    "crawl4ai>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "black>=24.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: `Depends(...)` em default de argumento é o idioma padrão do FastAPI.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# migrations do Alembic têm SQL literal longo (policies RLS)
"alembic/*" = ["E501"]

[tool.black]
line-length = 100
