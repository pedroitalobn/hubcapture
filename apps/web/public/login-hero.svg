<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice">
  <!-- Mapa do Brasil em contornos topográficos — placeholder on-brand
       até o asset do Magnific (login-hero.jpg) ser commitado -->
  <rect width="900" height="1200" fill="#222f30"/>

  <!-- graticule sutil -->
  <g stroke="#cef79e" stroke-width="0.5" stroke-opacity="0.06">
    <path d="M0 300h900M0 450h900M0 600h900M0 750h900M0 900h900"/>
    <path d="M150 0v1200M300 0v1200M450 0v1200M600 0v1200M750 0v1200"/>
  </g>

  <defs>
    <!-- traçado simplificado do contorno do Brasil -->
    <path id="br" d="M489 249
      L501 293 518 324 544 347 615 364 657 373 714 386 770 415 776 460
      739 511 714 545 705 572 693 635 673 696 608 720 576 723 552 755
      542 810 484 871 460 896 389 837 453 781 423 730 384 699 379 660
      389 633 375 601 340 558 258 519 170 511 113 448 180 398 178 313
      229 296 290 286 348 235 Z"/>
  </defs>

  <!-- curvas de nível: o mesmo contorno em offsets concêntricos -->
  <g fill="none" stroke="#cef79e" stroke-linejoin="round">
    <use href="#br" stroke-width="1.6" stroke-opacity="0.85"/>
    <use href="#br" stroke-width="1.1" stroke-opacity="0.45"
      transform="translate(450 555) scale(0.90) translate(-450 -555)"/>
    <use href="#br" stroke-width="1" stroke-opacity="0.28"
      transform="translate(450 555) scale(0.79) translate(-450 -555)"/>
    <use href="#br" stroke-width="0.9" stroke-opacity="0.16"
      transform="translate(450 555) scale(0.68) translate(-450 -555)"/>
    <use href="#br" stroke-width="0.8" stroke-opacity="0.08"
      transform="translate(450 555) scale(0.56) translate(-450 -555)"/>
  </g>

  <!-- pontos de cidade -->
  <g fill="#cef79e">
    <circle cx="554" cy="592" r="4" fill-opacity="0.95"/>   <!-- Brasília -->
    <circle cx="576" cy="716" r="2.8" fill-opacity="0.75"/> <!-- São Paulo -->
    <circle cx="348" cy="376" r="2.8" fill-opacity="0.7"/>  <!-- Manaus -->
    <circle cx="768" cy="462" r="2.6" fill-opacity="0.7"/>  <!-- Recife -->
    <circle cx="712" cy="545" r="2.4" fill-opacity="0.6"/>  <!-- Salvador -->
    <circle cx="498" cy="834" r="2.4" fill-opacity="0.6"/>  <!-- Porto Alegre -->
    <circle cx="544" cy="349" r="2.4" fill-opacity="0.6"/>  <!-- Belém -->
    <circle cx="712" cy="388" r="2.2" fill-opacity="0.55"/> <!-- Fortaleza -->
    <circle cx="608" cy="718" r="2" fill-opacity="0.5"/>    <!-- Rio -->
  </g>

  <!-- anel de foco em Brasília -->
  <g fill="none" stroke="#cef79e">
    <circle cx="554" cy="592" r="14" stroke-opacity="0.4"/>
    <circle cx="554" cy="592" r="26" stroke-opacity="0.18"/>
  </g>
</svg>
