# Compose de deploy — Hub Capture (raiz do repo → composePath: ./docker-compose.yml)
#
# NÃO publica portas no host: em plataformas com proxy (Dokploy/Traefik) publicar
# 0.0.0.0:3000/8000/5432 colide com outros apps. Aqui os serviços só se falam pela
# rede interna e são expostos ao proxy via `expose` — no painel do Dokploy você
# aponta o domínio para web:3000 (e, se quiser API pública, para api:8000).
#
# O Traefik do Dokploy roda na rede Docker EXTERNA `dokploy-network`. Os serviços
# com domínio (web/api) precisam estar nela, senão o proxy não os alcança e o
# domínio responde 502 Bad Gateway. Eles ficam nas DUAS redes: `default` (falar
# com postgres/redis) + `dokploy-network` (ser alcançado pelo proxy).
#
# Para rodar LOCALMENTE com portas publicadas, use `docker compose up` (sem -f):
# o docker-compose.override.yml (ao lado) publica 3000/8000/5432. O Dokploy roda
# com `-f ./docker-compose.yml`, então o override é ignorado no deploy.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hubcapture-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hubcapture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secret}
      POSTGRES_DB: ${POSTGRES_DB:-hubcapture}
      # senha da role de app não-superuser criada no init (RLS vale para ela)
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app_secret}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hubcapture} -d ${POSTGRES_DB:-hubcapture}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Refresh diário do banco. Processo SEPARADO da api de propósito: o sweep leva
  # minutos e não pode disputar o event loop que atende request. Reusa a imagem
  # da api (mesmo código/deps), só troca o comando.
  #
  # Sem este serviço o banco congela: hoje os dados só ficam frescos porque toda
  # abertura do painel coleta ao vivo — e é justamente isso que estamos tirando
  # do caminho do request. Ver src/jobs/refresh_diario.py.
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hubcapture-worker
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DATABASE_URL: postgresql+asyncpg://hubcapture_app:${APP_DB_PASSWORD:-app_secret}@postgres:5432/${POSTGRES_DB:-hubcapture}
      DATABASE_MIGRATOR_URL: postgresql+asyncpg://${POSTGRES_USER:-hubcapture}:${POSTGRES_PASSWORD:-postgres_secret}@postgres:5432/${POSTGRES_DB:-hubcapture}
      # 06:00 UTC ≈ 03:00 em Brasília — fora do horário de uso.
      REFRESH_DIARIO_HORA_UTC: ${REFRESH_DIARIO_HORA_UTC:-6}
      REFRESH_DIARIO_ATIVO: ${REFRESH_DIARIO_ATIVO:-1}
    # Sobrescreve o entrypoint da api (que sobe o uvicorn) — aqui o processo é o
    # agendador. Sem `--` o módulo herdaria o boot HTTP e subiria uma 2ª API.
    entrypoint: ["/app/apps/api/.venv/bin/python", "-m", "src.jobs.refresh_diario"]
    working_dir: /app/apps/api
    # NÃO entra na dokploy-network: o worker não recebe tráfego, só fala com o
    # banco e com as fontes externas. Menos superfície exposta.
    networks:
      - default
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hubcapture-api
    depends_on:
      postgres:
        condition: service_healthy
    # passa TODO o .env ao container (chaves de fonte/providers opcionais);
    # o bloco `environment` abaixo sobrescreve os hosts de banco p/ a rede interna.
    env_file:
      - .env
    environment:
      # dentro da rede do compose o host do banco é "postgres" (não localhost)
      DB_HOST: postgres
      DATABASE_URL: postgresql+asyncpg://hubcapture_app:${APP_DB_PASSWORD:-app_secret}@postgres:5432/${POSTGRES_DB:-hubcapture}
      DATABASE_MIGRATOR_URL: postgresql+asyncpg://${POSTGRES_USER:-hubcapture}:${POSTGRES_PASSWORD:-postgres_secret}@postgres:5432/${POSTGRES_DB:-hubcapture}
    expose:
      - "8000"
    # O boot leva ~11s (espera o Postgres, roda alembic, compila bytecode) e o
    # uvicorn só escuta no fim. Sem healthcheck o container já conta como "no ar"
    # assim que sobe, e o Traefik encaminha pra uma porta morta → 502 Bad Gateway
    # em toda janela de redeploy. Com o healthcheck o estado só vira healthy
    # quando /health responde de fato.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - default
      - dokploy-network
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Vazio (default) = same-origin: o navegador chama /api/v1/* no domínio
        # da web e o Next repassa à API via rede interna (API_INTERNAL_URL).
        # Só defina NEXT_PUBLIC_API_URL se a API tiver domínio público próprio.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    container_name: hubcapture-web
    depends_on:
      - api
    expose:
      - "3000"
    networks:
      - default
      - dokploy-network
    # Sem healthcheck, o provider Docker do Traefik não reavalia o endpoint e,
    # quando o deploy recria/reconecta o container (IP novo na dokploy-network),
    # o Traefik segue roteando pro IP ANTIGO → 502 "Bad Gateway" a cada deploy.
    # Com healthcheck, o endpoint só entra no balanceador quando saudável e é
    # reavaliado — o IP novo é captado (mesma proteção que o `api` já tem).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Fila para ARQ (sync pesado, retries, alertas) — declarado p/ as fases seguintes.
  redis:
    image: redis:7-alpine
    container_name: hubcapture-redis
    expose:
      - "6379"
    restart: unless-stopped

  # Orquestração de sync/alertas — sobe só com o perfil `orchestration`.
  n8n:
    image: n8nio/n8n:latest
    container_name: hubcapture-n8n
    expose:
      - "5678"
    environment:
      N8N_SECURE_COOKIE: "false"
    networks:
      - default
      - dokploy-network
    profiles:
      - orchestration
    restart: unless-stopped

volumes:
  pgdata:

networks:
  # rede do proxy do Dokploy (criada pelo próprio Dokploy no servidor).
  # Em dev local o docker-compose.override.yml a redefine como não-externa.
  dokploy-network:
    external: true
